name: Update Telegram Avatar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update avatar from Telegram
        run: |
          TG_HTML=$(curl -sL https://t.me/s0tkka)
          IMG_URL=$(echo "$TG_HTML" | grep -oP '(?<=<meta property="og:image" content=")[^"]+' | head -n 1)
          if [ -n "$IMG_URL" ]; then
            echo "Found Telegram avatar: $IMG_URL"
            curl -sLf "$IMG_URL" -o avatars/temp_avatar.jpg
            if [ -s avatars/temp_avatar.jpg ]; then
              mv avatars/temp_avatar.jpg avatars/current_avatar.jpg
              echo "Updated avatars/current_avatar.jpg successfully."
            else
              echo "Downloaded file is empty, keeping existing avatar."
              rm -f avatars/temp_avatar.jpg
            fi
          else
            echo "Could not find avatar URL from Telegram page"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add avatars/current_avatar.jpg
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update Telegram avatar for @s0tkka"
            git push
          else
            echo "No changes in avatar."
          fi
